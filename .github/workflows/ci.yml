name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check --select E9,F63,F7,F82 src tests
      - run: uv run pytest -q

      # Offline regression gate for the verification criteria (H4/H5): no model,
      # no network. Equivalence must stay rejected, defects must keep producing
      # witnesses, and a witness outside a declared contract must stay blocked.
      - name: Criteria gate
        run: uv run python scripts/criteria_gate.py

  vscode-extension:
    # Shelved by ADR-001: the extension still compiles so it does not rot
    # silently, but it is not a supported product and must not block a merge.
    name: VS Code extension build (shelved, not a gate)
    continue-on-error: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run compile
