name: AI PR Review

on:
  # Self-review only: this job reviews *this* repository and deliberately checks
  # out the PR's base branch as the reviewer, so a PR cannot break the tool that
  # reviews it. Other repositories must call
  # .github/workflows/ai-pr-review-reusable.yml instead, which installs the
  # reviewer from this repository rather than running the caller's source.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
      language:
        description: "Output language (auto, en, or zh)"
        default: "zh"
      post_inline:
        description: "Post high-confidence suggestions as inline review comments"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewer from base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Validate PR number
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "Error: PR number is required but not provided."
            exit 1
          fi
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}

      - name: Syntax and encoding check
        run: python -m compileall src tests

      - name: Checkout PR head for diagnostics
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: _pr_head

      - name: Create isolated report directory
        id: report_dir
        run: |
          report_dir="$(mktemp -d "$RUNNER_TEMP/ai-pr-review.XXXXXX")"
          echo "path=${report_dir}" >> "$GITHUB_OUTPUT"

      - name: Probe PR head Python syntax
        if: github.event_name == 'pull_request'
        id: pr_syntax
        continue-on-error: true
        run: |
          REPORT_DIR="${{ steps.report_dir.outputs.path }}"
          set +e
          python -m compileall _pr_head/src _pr_head/tests > "${REPORT_DIR}/pr-syntax-check.txt" 2>&1
          status=$?
          set -e
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          if [ "${status}" -ne 0 ]; then
            {
              echo "## PR Head Syntax Check"
              echo
              echo "The submitted PR head does not compile. The reviewer will still run from the base branch and analyze the PR diff."
              echo
              echo '```text'
              tail -n 80 "${REPORT_DIR}/pr-syntax-check.txt"
              echo '```'
              echo
            } > "${REPORT_DIR}/pr-syntax-check.md"
            exit "${status}"
          fi

      - name: Run AI PR Review
        id: review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          REVIEW_MODEL: ${{ secrets.REVIEW_MODEL }}
          AI_PR_REVIEW_TRUSTED_CI: "1"
          TRUSTED_PLAYBOOK_PATH: ${{ github.workspace }}/knowledge/playbook.md
          REPORT_DIR: ${{ steps.report_dir.outputs.path }}
          DECISION_LEDGER_ENABLED: "true"
          DECISION_LEDGER_PATH: ${{ steps.report_dir.outputs.path }}/decision-ledger.jsonl
        run: |
          PR_NUMBER="${{ github.event.pull_request.number || inputs.pr_number || '' }}"
          REPO="${{ github.repository }}"
          LANGUAGE="${{ inputs.language || 'zh' }}"
          LANGUAGE_ARGS=()
          if [ -n "${LANGUAGE}" ] && [ "${LANGUAGE}" != "auto" ]; then
            LANGUAGE_ARGS=(--language "${LANGUAGE}")
          fi

          AI_FLAG="--ai"
          if [ -z "${OPENAI_API_KEY}" ]; then
            AI_FLAG="--no-ai"
            echo "OPENAI_API_KEY not set (fork PR or missing secret); falling back to rule-only."
          fi

          REVIEWER_ARGS=()
          if uv run python -c 'import sys; from typer.main import get_command; from src.cli.main import app; command = get_command(app); sys.exit(0 if any("--reviewer-version" in getattr(p, "opts", []) for p in command.params) else 1)'; then
            REVIEWER_ARGS=(
              --reviewer-version "main-fallback"
              --execution-status "degraded"
              --degradation-reason "reviewer ran from PR base branch to isolate broken PR code"
              --report-confidence "fallback"
            )
          else
            echo "Checked-out reviewer does not support runtime metadata flags; continuing without them."
          fi

          REVIEW_META_ARGS=(
            --reviewed-commit "${{ github.event.pull_request.head.sha || github.sha }}"
            --trigger-event "${{ github.event_name }}"
            --workflow-run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          )

          uv run python -m src.cli.main "${REPO}" "${PR_NUMBER}" \
            "${LANGUAGE_ARGS[@]}" \
            "${REVIEWER_ARGS[@]}" \
            "${REVIEW_META_ARGS[@]}" \
            ${AI_FLAG} \
            --output "${REPORT_DIR}/pr-review.md"

      - name: Append PR syntax diagnostics
        if: always() && github.event_name == 'pull_request' && steps.pr_syntax.outputs.exit_code != '0'
        run: |
          REPORT_DIR="${{ steps.report_dir.outputs.path }}"
          if [ -f "${REPORT_DIR}/pr-review.md" ] && [ -f "${REPORT_DIR}/pr-syntax-check.md" ]; then
            {
              echo
              cat "${REPORT_DIR}/pr-syntax-check.md"
            } >> "${REPORT_DIR}/pr-review.md"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-pr-review-report
          path: |
            ${{ steps.report_dir.outputs.path }}/*
          if-no-files-found: warn
          retention-days: 30

      - name: Post inline review comments (high-confidence only — manual trigger only)
        id: inline_publication
        if: >-
          always() && steps.review.outcome == 'success' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.post_inline == 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPORT_DIR: ${{ steps.report_dir.outputs.path }}
        with:
          script: |
            const fs = require("fs");
            const path = `${process.env.REPORT_DIR}/pr-review.json`;
            const gate = require(`${process.env.GITHUB_WORKSPACE}/scripts/publication_gate.js`);
            const publicationPath = `${process.env.REPORT_DIR}/publication.json`;
            const writeTerminal = (status, reason, candidates = []) => fs.writeFileSync(
              publicationPath, JSON.stringify({ schema_version: 1, status, reason,
                candidates }, null, 2) + "\n");
            if (!fs.existsSync(path)) {
              writeTerminal("unavailable", "review_report_missing");
              core.warning("No JSON report from this run; inline publication is unavailable.");
              return;
            }

            const payload = JSON.parse(fs.readFileSync(path, "utf8"));
            const report = payload.report || payload;
            const prNumber = context.payload.pull_request?.number || Number(process.env.PR_NUMBER);
            const expectedHead = context.payload.pull_request?.head?.sha || report.pr?.head_sha;
            const identity = { repo: `${context.repo.owner}/${context.repo.repo}`,
              prNumber, headSha: expectedHead };
            if (!gate.validateRunReport(report, identity)) {
              core.warning("Report identity, status, or lifecycle is not eligible for inline publication.");
              writeTerminal("unavailable", "report_not_eligible_for_publication",
                (report.suggestions || []).map((_, index) => ({ candidate_id: index,
                  status: "withheld_report_not_eligible" })));
              return;
            }
            // One source for the publishing threshold: the reviewer stamps it into
            // the report so this file cannot drift from the Python settings.
            const minConfidence = typeof report.metrics?.publish_min_confidence === "number"
              ? report.metrics.publish_min_confidence
              : 0.80;
            const eligible = new Set(gate.eligibleSuggestions(report, identity).map(item => item.index));
            const aiSuggestions = (report.suggestions || [])
              .flatMap((s, index) => eligible.has(index)
                && s.confidence >= minConfidence && s.line != null ? [{
                file_path: s.file_path,
                line: s.line,
                severity: s.severity,
                confidence: s.confidence,
                title: s.title,
                reason: s.reason,
                recommendation: s.recommendation,
                source: s.source,
                candidate_id: index,
              }] : []);
            // Raw rule hits have no established failure scenario or verified evidence.
            const MAX_INLINE = 10;
            const inlineComments = aiSuggestions.slice(0, MAX_INLINE);

            if (aiSuggestions.length === 0) {
              core.info(`No suggestions at or above confidence ${minConfidence} to post.`);
              return;
            }
            if (aiSuggestions.length > inlineComments.length) {
              core.warning(
                `Publishing the first ${MAX_INLINE} of ${aiSuggestions.length} suggestions; ` +
                `${aiSuggestions.length - inlineComments.length} were not posted.`
              );
            }

            const commitId = report.pr?.head_sha;
            if (!commitId) {
              core.warning("No head_sha in report; cannot post inline comments.");
              return;
            }
            let current;
            try {
              current = await github.rest.pulls.get({ owner: context.repo.owner,
                repo: context.repo.repo, pull_number: prNumber });
            } catch (error) {
              core.warning(`Cannot verify current PR head; no inline comments sent: ${error.message}`);
              writeTerminal("partial", "could_not_read_current_head",
                inlineComments.map(s => ({ candidate_id: s.candidate_id,
                  status: "not_attempted_head_check_error" })));
              return;
            }
            if (current.data.head?.sha !== commitId) {
              core.warning("PR head changed after review; no inline comments sent.");
              writeTerminal("stale_head", "pr_head_changed_before_publication",
                inlineComments.map(s => ({ candidate_id: s.candidate_id,
                  status: "not_attempted_stale_head" })));
              return;
            }

            core.info(`Posting ${inlineComments.length} inline review comment(s)...`);
            let posted = 0;
            let failed = 0;
            const publicationOutcomes = [];
            for (const s of inlineComments) {
              let commentAttempted = false;
              try {
                const beforePost = await github.rest.pulls.get({ owner: context.repo.owner,
                  repo: context.repo.repo, pull_number: prNumber });
                if (beforePost.data.head?.sha !== commitId) {
                  core.warning("PR head changed before an inline comment; stopping publication.");
                  break;
                }
                const body = `**${s.severity}** (${Math.round(s.confidence * 100)}%; source: ${s.source}): ${s.title}\n\n${s.reason}\n\n> ${s.recommendation}`;
                commentAttempted = true;
                await github.rest.pulls.createReviewComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  commit_id: commitId,
                  path: s.file_path,
                  line: s.line,
                  side: "RIGHT",
                  body: body,
                });
                core.info(`  ✓ ${s.file_path}:${s.line} — ${s.title}`);
                posted++;
                publicationOutcomes.push({ candidate_id: s.candidate_id,
                  file_path: s.file_path, line: s.line, status: "published" });
              } catch (error) {
                core.warning(`  ✗ ${s.file_path}:${s.line} — ${error.message}`);
                publicationOutcomes.push({ candidate_id: s.candidate_id,
                  file_path: s.file_path, line: s.line,
                  status: commentAttempted ? "unknown_after_api_error" : "not_attempted_head_check_error" });
                if (commentAttempted) failed++;
                else break;
              }
            }
            fs.writeFileSync(`${process.env.REPORT_DIR}/publication.json`, JSON.stringify({
              schema_version: 1, owner: context.repo.owner, repo: context.repo.repo,
              pr: prNumber, head: commitId,
              status: failed || publicationOutcomes.some(item =>
                item.status === "not_attempted_head_check_error" ||
                item.status === "not_attempted_stale_head") ? "partial" : "complete",
              candidates: publicationOutcomes,
            }, null, 2) + "\n");
            // A posting failure must be accountable, not just a warning in the log.
            core.info(`Inline review published: ${posted} posted, ${failed} failed, ${inlineComments.length} attempted.`);

      - name: Upload inline publication status
        if: always() && steps.inline_publication.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: ai-pr-review-publication-status
          path: ${{ steps.report_dir.outputs.path }}/publication.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Post summary comment
        if: >-
          always() && steps.review.outcome == 'success' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPORT_DIR: ${{ steps.report_dir.outputs.path }}
        with:
          script: |
            const fs = require("fs");
            const path = `${process.env.REPORT_DIR}/pr-review.md`;
            const jsonPath = `${process.env.REPORT_DIR}/pr-review.json`;
            const gate = require(`${process.env.GITHUB_WORKSPACE}/scripts/publication_gate.js`);
            if (!fs.existsSync(jsonPath)) {
              core.warning("No JSON report from this run; skipping summary comment.");
              return;
            }
            const payload = JSON.parse(fs.readFileSync(jsonPath, "utf8"));
            const structured = payload.report || payload;
            const prNumber = context.payload.pull_request?.number || Number(process.env.PR_NUMBER);
            const expectedHead = context.payload.pull_request?.head?.sha || structured.pr?.head_sha;
            if (!gate.validateRunReport(structured, {
              repo: `${context.repo.owner}/${context.repo.repo}`, prNumber, headSha: expectedHead,
            })) {
              core.warning("Report identity, status, or lifecycle is not eligible for summary publication.");
              return;
            }
            let current;
            try {
              current = await github.rest.pulls.get({ owner: context.repo.owner,
                repo: context.repo.repo, pull_number: prNumber });
            } catch (error) {
              core.warning(`Cannot verify current PR head; summary not published: ${error.message}`);
              return;
            }
            if (current.data.head?.sha !== structured.pr.head_sha) {
              core.warning("PR head changed after review; summary not published.");
              return;
            }
            if (!fs.existsSync(path)) {
              core.warning("No pr-review.md found; skipping summary comment.");
              return;
            }
            let body = "<!-- ai-pr-review-bot -->\n\n";
            const report = fs.readFileSync(path, "utf8");
            const lines = report.split("\n");
            const maxLines = 220;
            body += lines.slice(0, maxLines).join("\n");
            if (lines.length > maxLines) {
              const artifactUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
              body += "\n\n...\n\n";
              body += `> 完整报告请查看 [GitHub Actions Artifact](${artifactUrl}) 或下载 \`ai-pr-review-report\` artifact。\n`;
            }

            if (!prNumber) return;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botMarker = "<!-- ai-pr-review-bot -->";
            const botLogin = "github-actions[bot]";
            const existing = comments.find(
              c => c.user?.login === botLogin && c.body?.includes(botMarker)
            );

            try {
              const beforePost = await github.rest.pulls.get({ owner: context.repo.owner,
                repo: context.repo.repo, pull_number: prNumber });
              if (beforePost.data.head?.sha !== structured.pr.head_sha) {
                core.warning("PR head changed before the summary comment; skipping publication.");
                return;
              }
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: body,
                });
                core.info("Updated existing bot summary comment.");
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: body,
                });
                core.info("Created new bot summary comment.");
              }
            } catch (error) {
              core.warning(`Failed to post PR comment: ${error.message}`);
            }

      - name: Fail if PR head has syntax errors
        if: always() && github.event_name == 'pull_request' && steps.pr_syntax.outputs.exit_code != '0'
        run: |
          echo "PR head syntax check failed. Review report was generated, but this PR should not be merged until the syntax errors are fixed."
          exit 1
